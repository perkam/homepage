version: 2

workflows:
  version: 2
  build:
    jobs:
      - build:
          filters:
            branches:
              only: master
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master

jobs:
  build:
    docker:
      - image: klakegg/hugo:latest
    working_directory: ~/blog
    environment:
      HUGO_BUILD_DIR: docs
    steps:
      - checkout
      - run: HUGO_ENV=production hugo -F -v -d $HUGO_BUILD_DIR
      - persist_to_workspace:
          root: docs
          paths: .
  deploy:
    docker:
      - image: node:8.10.0
    steps:
      - checkout
      - attach_workspace:
          at: docs
      - add_ssh_keys:
          fingerprints:
            - "aa:46:18:47:7b:8b:63:82:bf:12:08:81:73:4e:4b:99"
      - run:
          name: Disable jekyll builds
          command: touch docs/.nojekyll
      - run:
          name: Custom Domain
          command: echo "www.kaminskidev.com" > docs/CNAME
      - run:
          name: Push built page to master branch
          command: |
            cd docs
            ls
            git init
            git remote add origin git@github.com:perkam/homepage.git
            git fetch --all
            git stash
            git checkout gh-pages
            git pull
            git config user.email "lampo100@gmail.com"
            git config user.name "perkam"
            rm -rf .
            git stash pop
            git add *
            git commit -m "Push new page version"
            git push

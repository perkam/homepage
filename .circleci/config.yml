version: 2

workflows:
  version: 2
  build:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
orbs:
  node: circleci/node@5.0.2
jobs:
  build:
    docker:
      - image: klakegg/hugo:latest
    working_directory: ~/blog
    environment:
      HUGO_BUILD_DIR: public
    steps:
      - checkout
      - node/install:
          install-yarn: true
          node-version: '16.13'
      - run:
          name: Build page
          command: |
            npm install -y
            npm run build
            HUGO_ENV=production hugo -F -v -d $HUGO_BUILD_DIR
      - persist_to_workspace:
          root: public
          paths: .
  deploy:
    docker:
      - image: node:8.10.0
    steps:
      - checkout
      - attach_workspace:
          at: public
      - add_ssh_keys:
          fingerprints:
            - "aa:46:18:47:7b:8b:63:82:bf:12:08:81:73:4e:4b:99"
      - run:
          name: Disable jekyll builds
          command: touch public/.nojekyll
      - run:
          name: Custom Domain
          command: echo "www.kaminskidev.com" > public/CNAME
      - run:
          name: Push built page to master branch
          command: |
            mkdir gh-pages
            cd gh-pages
            git init
            git config user.email "lampo100@gmail.com"
            git config user.name "perkam"
            git remote add origin git@github.com:perkam/homepage.git
            echo "Fetch"
            git fetch --all
            echo "checkout"
            git checkout gh-pages
            echo "Pull"
            git pull
            rm -rf *
            git clean -fxd
            mv -f ../public/* .
            git add *
            git commit -m "Push new page version"
            git push

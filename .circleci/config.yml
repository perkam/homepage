version: 2.1
workflows:
  version: 2
  build:
    jobs:
      - build-css
      - build:
          requires:
            - build-css
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
orbs:
  node: circleci/node@5.0.2
  hugo: circleci/hugo@1.3.0
jobs:
  build-css:
    docker:
      - image: node:latest
    working_directory: ~/blog
    steps:
      - checkout
      - run: npm install -y yarn
      - run:
          name: Build css
          command: |
            npm install -y
            npm run css
      - persist_to_workspace:
          root: .
          paths: static/main.css
  build:
    docker: # executor type
      - image: jguyomard/hugo-builder
    working_directory: ~/blog
    environment:
      HUGO_BUILD_DIR: public
    steps:
      - checkout
      - attach_workspace:
          # Must be absolute path or relative path from working_directory
          at: /tmp/workspace
      - run:
          name: Build project
          command: |
            HUGO_ENV=production hugo -F -v -d $HUGO_BUILD_DIR
            mv /tmp/workspace/static/main.css $HUGO_BUILD_DIR/main.css
      - persist_to_workspace:
          root: public
          paths: .
  deploy:
    docker:
      - image: node:8.10.0
    steps:
      - checkout
      - attach_workspace:
          at: public
      - add_ssh_keys:
          fingerprints:
            - "91:7e:a3:a8:c8:58:f1:27:3c:89:d7:8f:b6:59:75:09"
      - run:
          name: Disable jekyll builds
          command: touch public/.nojekyll
      - run:
          name: Custom Domain
          command: echo "kaminskidev.com" > public/CNAME
      - run:
          name: Push built page to master branch
          command: |
            mkdir gh-pages
            cd gh-pages
            git init
            git config user.email "lampo100@gmail.com"
            git config user.name "perkam"
            git remote add origin git@github.com:perkam/homepage.git
            echo "Fetch"
            git fetch --all
            echo "checkout"
            git checkout gh-pages
            echo "Pull"
            git pull
            rm -rf *
            git clean -fxd
            mv -f ../public/* .
            git add *
            git commit --allow-empty -m "Push new page version"
            git push

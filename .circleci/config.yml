version: 2.1
workflows:
  version: 2
  build:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
orbs:
  node: circleci/node@5.0.2
  hugo: circleci/hugo@1.3.0
jobs:
  build:
    docker: # executor type
      - image: ubuntu:latest
    working_directory: ~/blog
    environment:
      HUGO_BUILD_DIR: public
    steps:
      - checkout
      - run:
          name: Install and set Linuxbrew
          command: |
            apt-get update && apt-get install -y build-essential curl file git
            sh -c "$(curl -fsSL https://raw.githubusercontent.com/Linuxbrew/install/master/install.sh)"
            
            echo 'export PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin/:$PATH"' >> $BASH_ENV
            echo 'export MANPATH="/home/linuxbrew/.linuxbrew/share/man:$MANPATH"' >> $BASH_ENV
            echo 'export INFOPATH="/home/linuxbrew/.linuxbrew/share/info:$INFOPATH"' >> $BASH_ENV
      - run: apt-get update && apt-get install curl -y
      - run: brew install hugo
      - node/install:
          install-yarn: true
          node-version: '16.13'
      - run:
          name: Build page
          command: |
            npm install -y
            npm run build
            HUGO_ENV=production hugo -F -v -d $HUGO_BUILD_DIR
      - persist_to_workspace:
          root: public
          paths: .
  deploy:
    docker:
      - image: node:8.10.0
    steps:
      - checkout
      - attach_workspace:
          at: public
      - add_ssh_keys:
          fingerprints:
            - "91:7e:a3:a8:c8:58:f1:27:3c:89:d7:8f:b6:59:75:09"
      - run:
          name: Disable jekyll builds
          command: touch public/.nojekyll
      - run:
          name: Custom Domain
          command: echo "www.kaminskidev.com" > public/CNAME
      - run:
          name: Push built page to master branch
          command: |
            mkdir gh-pages
            cd gh-pages
            git init
            git config user.email "lampo100@gmail.com"
            git config user.name "perkam"
            git remote add origin git@github.com:perkam/homepage.git
            echo "Fetch"
            git fetch --all
            echo "checkout"
            git checkout gh-pages
            echo "Pull"
            git pull
            rm -rf *
            git clean -fxd
            mv -f ../public/* .
            git add *
            git commit -m "Push new page version"
            git push
